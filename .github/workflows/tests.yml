# Automatische Tests: Logik, Webserver, Sprachdateien, Anleitung und die Oberfläche mit echtem PySide6 (ohne
# Bildschirm, QT_QPA_PLATFORM=offscreen). Start bei jedem Push und Pull Request sowie von Hand.
# Fehlgeschlagene Tests erscheinen als Hinweise (Annotations) im Lauf.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete (Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - name: Prometheus-Server (für den Datenbanktest, nur Linux)
        if: runner.os == 'Linux'
        run: |
          V=2.53.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v$V/prometheus-$V.linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          printf 'global:\n  scrape_interval: 1h\n' > "$RUNNER_TEMP/prom.yml"
          "$RUNNER_TEMP/prometheus-$V.linux-amd64/prometheus" --config.file="$RUNNER_TEMP/prom.yml" \
            --storage.tsdb.path="$RUNNER_TEMP/promdata" --web.enable-remote-write-receiver \
            --web.listen-address=127.0.0.1:9090 > "$RUNNER_TEMP/prom.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9090/-/ready >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:9090/-/ready && echo "PLC_TEST_PROMETHEUS=http://127.0.0.1:9090" >> "$GITHUB_ENV"
      - name: Python-Pakete
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-ergebnis.xml tests
      - name: Fehler als Hinweise
        if: always()
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("test-ergebnis.xml"):
              print("::error::Keine Testergebnisse (Abbruch vor den Tests?)"); raise SystemExit
          root = ET.parse("test-ergebnis.xml").getroot()
          n = f = 0
          for case in root.iter("testcase"):
              n += 1
              for tag in ("failure", "error"):
                  for el in case.findall(tag):
                      f += 1
                      text = ((el.get("message") or "") + "\n" + (el.text or ""))[-3000:]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          print(f"::notice title=Tests ${{ matrix.os }}::{n} Tests, {f} fehlgeschlagen")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ergebnis-${{ matrix.os }}
          path: test-ergebnis.xml
