# AppImages für Linux (x86_64 und arm64) aller drei Datenlogger bauen.
# Start: bei einem Tag "v*" oder von Hand (Actions › AppImages › Run workflow). Ergebnis: Artefakte je Programm und
# Architektur; bei einem Tag zusätzlich als Dateien eines GitHub-Release.
#
# Erwartete Ordnerstruktur im Repository (wie geliefert):
#   ./                  S7 Datenlogger (s7_*.py, build_appimage.sh)
#   ./clx_datenlogger   CLX Datenlogger
#   ./tia_datenlogger   TIA Datenlogger
name: AppImages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        project: [".", "clx_datenlogger", "tia_datenlogger", "plc_datenlogger"]
        # x86_64: Ubuntu 22.04 (läuft auf Ubuntu 22.04+, Debian 12+ …)
        # arm64:  Ubuntu 24.04 (PyQt6-Wheels für arm64 brauchen ein neueres glibc; läuft auf Ubuntu 24.04+, Debian 13+,
        #         Raspberry Pi OS ab Trixie). Für ältere arm64-Systeme dort direkt bauen, siehe Bedienungsanleitung.
        runner: ["ubuntu-22.04", "ubuntu-24.04-arm"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systempakete (Qt-Laufzeit, Compiler für libplctag)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential file libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libfontconfig1 libdbus-1-3
      - name: AppImage bauen
        working-directory: ${{ matrix.project }}
        run: ./build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.project == '.' && 's7' || matrix.project }}-${{ matrix.runner }}
          path: ${{ matrix.project }}/dist/*.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.project }}/dist/*.AppImage
