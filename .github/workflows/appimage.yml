# AppImages und Debian-Pakete (.deb) des PLC Datenloggers für Linux (x86_64 und arm64) bauen.
# Start: bei einem Tag "v*" oder von Hand (Actions › AppImages › Run workflow). Ergebnis: Artefakte je Architektur;
# bei einem Tag zusätzlich als Dateien eines GitHub-Release.
name: AppImages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag (z. B. v3.0.0): diesen Stand bauen und die Dateien an sein Release hängen; leer = nur Artefakte"
        required: false
        default: ""
  push:
    tags: ["v*", "V*"]

# Schreibrecht für den Release-Schritt (Dateien an ein GitHub-Release hängen)
permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        # x86_64: Ubuntu 22.04 (läuft auf Ubuntu 22.04+, Debian 12+ …)
        # arm64:  Ubuntu 24.04 (PySide6-Wheels für arm64 brauchen ein neueres glibc; läuft auf Ubuntu 24.04+, Debian 13+,
        #         Raspberry Pi OS ab Trixie). Für ältere arm64-Systeme dort direkt bauen, siehe Bedienungsanleitung.
        runner: ["ubuntu-22.04-arm"]
    env:
      # Tag, zu dem ein Release gehört: Tag-Push oder von Hand angegebener Tag (leer = nur Artefakte)
      REL_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag und Versionsnummer prüfen, Release-Text aus CHANGELOG.md
        if: env.REL_TAG != ''
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/bump_version.py --check-tag "${REL_TAG,,}"
          python tools/bump_version.py --notes > release_notes.md
      - name: Systempakete (Qt-Laufzeit, Compiler für libplctag)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential file libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-image0 libfontconfig1 libdbus-1-3
      - name: AppImage und .deb bauen
        run: bash ./build_appimage.sh     # mit bash: läuft auch, wenn das Skript nicht als ausführbar markiert ist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.runner }}
          path: |
            dist/*.AppImage
            dist/*.deb
      - name: Release
        if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          body_path: release_notes.md
          files: |
            dist/*.AppImage
            dist/*.deb
