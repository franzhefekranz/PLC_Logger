# Windows-Programme des PLC Datenloggers bauen: portables ZIP und Installer (Inno Setup).
# Start: bei einem Tag "v*" oder von Hand (Actions › Windows › Run workflow). Ergebnis: Artefakte
# (PLCDatenlogger_portable_<Version>.zip und PLCDatenlogger_Setup_<Version>.exe); bei einem Tag zusätzlich als
# Dateien eines GitHub-Release.
#
# Gebaut wird mit build.bat (wie auf dem eigenen PC), ohne Pause am Ende (NOPAUSE) und mit dem Python dieses Workflows
# (BUILD_PYTHON). Die Versionsnummer kommt aus APP_VERSION in src/plc_common.py; bei einem Tag muss sie dazu passen
# (tools/bump_version.py --check-tag), der Release-Text kommt aus CHANGELOG.md.
name: Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Tag (z. B. v3.0.0): diesen Stand bauen und die Dateien an sein Release hängen; leer = nur Artefakte"
        required: false
        default: ""
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  windows:
    env:
      # Tag, zu dem ein Release gehört: Tag-Push oder von Hand angegebener Tag (leer = nur Artefakte)
      REL_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Tag und Versionsnummer prüfen, Release-Text aus CHANGELOG.md
        if: env.REL_TAG != ''
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/bump_version.py --check-tag "${REL_TAG,,}"
          python tools/bump_version.py --notes > release_notes.md
      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress
      - name: Programme, portables ZIP und Installer bauen
        shell: cmd
        env:
          NOPAUSE: "1"
          BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: call build.bat all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*_portable_*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: anleitung-pdf
          path: |
            dist/*.pdf
            build/doc/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/*_Setup_*.exe
          if-no-files-found: warn
      - name: Release
        if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          body_path: release_notes.md
          files: |
            dist/*_portable_*.zip
            installer/*_Setup_*.exe
            dist/*.pdf
