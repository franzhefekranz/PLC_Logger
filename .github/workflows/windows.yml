# Windows-Programme aller vier Datenlogger bauen: portables ZIP und Installer (Inno Setup).
# Start: bei einem Tag "v*" oder von Hand (Actions › Windows › Run workflow). Ergebnis: Artefakte je Programm
# (…_portable_<Version>.zip und …_Setup_<Version>.exe); bei einem Tag zusätzlich als Dateien eines GitHub-Release.
#
# Gebaut wird mit build.bat (wie auf dem eigenen PC), ohne Pause am Ende (NOPAUSE) und mit dem Python dieses Workflows
# (BUILD_PYTHON). Die Versionsnummer steht oben in build.bat (VERSION).
name: Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Schreibrecht für den Release-Schritt (Dateien an ein GitHub-Release hängen)
permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: "."
            name: s7
          - project: "clx_datenlogger"
            name: clx
          - project: "tia_datenlogger"
            name: tia
          - project: "plc_datenlogger"
            name: plc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress
      - name: Programme, portables ZIP und Installer bauen
        working-directory: ${{ matrix.project }}
        shell: cmd
        env:
          NOPAUSE: "1"
          BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: call build.bat all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}-portable
          path: ${{ matrix.project }}/dist/*_portable_*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}-setup
          path: ${{ matrix.project }}/installer/*_Setup_*.exe
          if-no-files-found: warn
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.project }}/dist/*_portable_*.zip
            ${{ matrix.project }}/installer/*_Setup_*.exe
